<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Swissquote Wallet architecture: client device (real), Swissquote and partner services (mocked, separate processes), Bitcoin network (real)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475467"/>
    </marker>
    <style>
      .title { font-size: 15px; font-weight: 700; fill: #1d2939; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .item { font-size: 13px; fill: #1d2939; }
      .small { font-size: 12px; fill: #475467; }
      .label { font-size: 12px; fill: #344054; }
      .line { stroke: #475467; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" class="title" font-size="18">Swissquote Wallet — 2-of-3 Bitcoin multisig</text>
  <text x="500" y="56" text-anchor="middle" class="small">Green: real. Yellow: mocked, each a separate process with its own storage.</text>

  <!-- Client side (real) -->
  <rect x="30" y="90" width="300" height="330" rx="14" fill="#ecfdf3" stroke="#067647" stroke-width="1.6"/>
  <text x="50" y="116" class="tag" fill="#067647">REAL</text>
  <text x="50" y="138" class="title">Client device</text>
  <rect x="50" y="154" width="260" height="128" rx="10" fill="#ffffff" stroke="#98a2b3"/>
  <text x="64" y="178" class="item" font-weight="600">Web app (React)</text>
  <text x="64" y="200" class="small">• builds and checks each PSBT</text>
  <text x="64" y="219" class="small">• phone key, encrypted in a local vault</text>
  <text x="64" y="238" class="small">• backup key rebuilt in memory only,</text>
  <text x="76" y="255" class="small">during a recovery or an exit</text>
  <text x="64" y="273" class="small">• exit flow that needs no Swissquote</text>
  <rect x="50" y="296" width="260" height="52" rx="10" fill="#ffffff" stroke="#98a2b3"/>
  <text x="64" y="318" class="item" font-weight="600">Passkey (secure chip)</text>
  <text x="64" y="337" class="small">approves each payment (WebAuthn)</text>
  <rect x="50" y="358" width="260" height="48" rx="10" fill="#ffffff" stroke="#98a2b3"/>
  <text x="64" y="379" class="item" font-weight="600">Client share of the backup key</text>
  <text x="64" y="396" class="small">C1 paper · C2 encrypted cloud copy</text>

  <!-- Swissquote (mock) -->
  <rect x="600" y="90" width="370" height="230" rx="14" fill="#fffaeb" stroke="#b54708" stroke-width="1.6"/>
  <text x="620" y="116" class="tag" fill="#b54708">MOCK</text>
  <text x="620" y="138" class="title">Swissquote service</text>
  <text x="620" y="164" class="item">• login (KYC reused) and passkey checks</text>
  <text x="620" y="186" class="item">• cosigner: Swissquote key (1 of 3)</text>
  <text x="634" y="205" class="small">instant amount, delay, sanctions, freeze</text>
  <text x="620" y="228" class="item">• wallet registry (Travel Rule)</text>
  <text x="620" y="250" class="item">• recovery: freeze, delay, sweep to</text>
  <text x="634" y="269" class="small">the new wallet only, backup key required</text>
  <text x="620" y="292" class="item">• alerts (SMS / email / client area)</text>
  <text x="620" y="310" class="small">Holds no share of the backup key.</text>

  <!-- Partner (mock) -->
  <rect x="600" y="340" width="370" height="150" rx="14" fill="#fffaeb" stroke="#b54708" stroke-width="1.6"/>
  <text x="620" y="366" class="tag" fill="#b54708">MOCK</text>
  <text x="620" y="388" class="title">Independent partner</text>
  <text x="620" y="414" class="item">• holds the partner share of the backup key</text>
  <text x="620" y="436" class="item">• own identity check and own delay</text>
  <text x="620" y="458" class="item">• works even if Swissquote is gone</text>
  <text x="620" y="478" class="small">Option: a trusted person (notary) holds it instead.</text>

  <!-- Bitcoin (real) -->
  <rect x="30" y="470" width="300" height="100" rx="14" fill="#ecfdf3" stroke="#067647" stroke-width="1.6"/>
  <text x="50" y="496" class="tag" fill="#067647">REAL</text>
  <text x="50" y="518" class="title">Bitcoin network</text>
  <text x="50" y="540" class="item">signet (public, demo) · regtest (local, dev)</text>
  <text x="50" y="558" class="small">esplora API: UTXOs, broadcast, status</text>

  <!-- Arrows -->
  <path class="line" d="M330 190 L600 190" marker-end="url(#arrow)"/>
  <text x="465" y="180" text-anchor="middle" class="label">PSBT + passkey assertion</text>
  <path class="line" d="M600 226 L330 226" marker-end="url(#arrow)"/>
  <text x="465" y="244" text-anchor="middle" class="label">cosigned PSBT, or held / refused</text>

  <path class="line" d="M330 390 L600 390" marker-end="url(#arrow)"/>
  <text x="465" y="380" text-anchor="middle" class="label">partner share, sealed for the partner</text>
  <path class="line" d="M600 430 L330 430" marker-end="url(#arrow)"/>
  <text x="465" y="448" text-anchor="middle" class="label">share re-sealed for the new device (recovery)</text>

  <path class="line" d="M180 420 L180 470" marker-end="url(#arrow)"/>
  <text x="192" y="452" class="label">broadcast · balance</text>

  <path class="line" stroke-dasharray="5 5" d="M785 320 L785 340"/>
  <text x="800" y="334" class="small">never talk to each other</text>
</svg>
